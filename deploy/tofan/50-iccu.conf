server {
    listen 443 ssl;
    http2 on;
    server_name iccu.157.90.117.20.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/iccu.157.90.117.20.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iccu.157.90.117.20.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iccu_api http://iccu-api:8080;
    set $iccu_web http://iccu-web:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/hubs/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $iccu_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $iccu_api;
    }

    location / {
        proxy_pass $iccu_web;
    }
}
