services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iccu
      POSTGRES_USER: iccu
      POSTGRES_PASSWORD: ${ICCU_DB_PASSWORD}
      TZ: Asia/Tashkent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iccu-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iccu -d iccu"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

volumes:
  postgres-data:

networks:
  iccu-net:
    external: true
