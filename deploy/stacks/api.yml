services:
  iccu-api:
    image: ${ICCU_API_IMAGE}
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=iccu;Username=iccu;Password=${ICCU_DB_PASSWORD}"
      Jwt__SigningKey: ${ICCU_JWT_SIGNING_KEY}
      Koha__Username: koha
      Koha__Password: ${ICCU_KOHA_PASSWORD}
    volumes:
      - type: bind
        source: /opt/iccu/files
        target: /var/iccu/files
    networks:
      - iccu-net
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s

networks:
  iccu-net:
    external: true
